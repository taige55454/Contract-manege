name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: 1. 检出源码 (Checkout)
        uses: actions/checkout@v4

      - name: 2. 配置 Node.js 20 环境 (无需 package-lock.json)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. 安装依赖并针对 Electron 内核编译 SQLite 原生模块
        run: npm install --no-audit --no-fund

      - name: 4. 使用 Electron 内核执行冒烟测试 (统一 ABI 版本，验证编号生成、多方合并与资源释放)
        env:
          ELECTRON_RUN_AS_NODE: 1
        run: npm test

      - name: 5. 打包生成 Windows .exe (免安装便携版 Portable + 安装版 Setup)
        run: npm run dist:win

      - name: 6. 上传编译好的 .exe 到 GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ContractManager-Windows-EXE
          path: |
            dist/*.exe
          if-no-files-found: error
